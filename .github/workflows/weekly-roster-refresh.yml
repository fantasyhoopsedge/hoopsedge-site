name: Weekly roster refresh (Phase A)

# Phase A of the weekly process (see docs/weekly-refresh-process.md): pulls
# Pocaro's roster sheet, reconciles depth-chart/role-context against it, and
# emails a worklist. Deliberately stops here — it never runs the projection
# stages. Do NOT add that here; Ash needs to review/tinker in
# /admin/depth-chart and /admin/role-context first, then trigger
# "Phase B: rebuild 2026-27 projections" manually once he's done. See that
# workflow's own comment for why this is two workflows, not one.
on:
  schedule:
    - cron: "0 5 * * 1" # Monday 05:00 UTC (~09:00 Asia/Dubai)
  workflow_dispatch: {}

concurrency:
  group: weekly-roster-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # depth-chart:pipeline shells out to Python (prep_depth_chart.py,
      # flag_role_changes.py both import pandas) — missing this step failed
      # the first real run 2026-09-04 with ModuleNotFoundError. prep_role_context.py
      # is pure-stdlib and looked fine on its own, which is what made this easy
      # to miss when only Phase B's workflow got a Python setup step.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r models/requirements.txt

      # depth-chart:pipeline's last step (flag_role_changes.py) reads
      # output/foundation/*.parquet directly, no existence check. output/ is
      # entirely gitignored ("regenerate at will"), so it doesn't exist on a
      # fresh checkout — same class of gap as phase-b-projections.yml's
      # Stage 0/3/4 steps, just not noticed here until the second real run
      # 2026-09-04 (prep_depth_chart.py's OWN read of the projections JSON is
      # guarded with an existence check, which is what let it succeed without
      # this and made the gap easy to miss).
      - name: Build Stage 0 foundation data (flag_role_changes.py needs it)
        run: python models/data-foundation/build_foundation.py

      - name: Pull Pocaro's roster sheet
        run: npm run pocaro:sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}

      - name: Reconcile depth-chart / role-context / team-category
        run: npm run depth-chart:pipeline
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit the refreshed roster/depth-chart CSVs + bundled JSON
        run: |
          git config user.name "fhe-weekly-refresh-bot"
          git config user.email "actions@github.com"
          git add data/nba-rosters/2026-27.csv \
                  data/nba-rosters/depth-chart-2026-27.csv \
                  data/nba-rosters/role-context-2026-27.csv \
                  data/nba-rosters/team-category-2026-27.csv \
                  src/data/depth-chart-2026-27.json \
                  src/data/role-context-2026-27.json \
                  src/data/role-flags-2026-27.json
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "chore(weekly-refresh): Phase A roster + depth-chart sync $(date -u +%Y-%m-%d)"
            git push
          fi

      # Always try to notify, even if a step above failed — a broken refresh
      # is exactly when Ash most needs to hear about it. The notifier itself
      # never fails the job (see its own docstring).
      - name: Email the worklist
        if: always()
        run: npm run weekly:notify
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          STALENESS_ALERT_TO: ${{ secrets.STALENESS_ALERT_TO }}

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-refresh-review
          path: |
            output/pocaro-roster-review.json
            output/depth-chart-pipeline-review.md
          if-no-files-found: ignore
          retention-days: 14
